<script>

const BASE=FIREBASE_URL.replace(/\/+$/,'');
let cache={},subs=[],lastS='';
const jx=(path,method,body)=>fetch(BASE+'/'+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error('Database error '+r.status);return r.json()});
async function pull(){const d=await jx('','GET'),s=JSON.stringify(d||{});if(s===lastS)return;lastS=s;cache=d||{};subs.forEach(f=>f())}
const rid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DB={
  doc(path){const [c,id]=path.split('/');return{
    set:x=>jx(path,'PUT',x).then(pull),update:x=>jx(path,'PATCH',x).then(pull),delete:()=>jx(path,'DELETE').then(pull),
    onSnapshot(cb){const f=()=>{const v=(cache[c]||{})[id];cb({exists:v!=null,data:()=>v})};subs.push(f);f()}}},
  collection(c){return{
    onSnapshot(cb){const f=()=>{const o=cache[c]||{};cb({docs:Object.keys(o).map(id=>({id,data:()=>o[id]}))})};subs.push(f);f()},
    doc(id){id=id||rid();return{id,set:x=>jx(c+'/'+id,'PUT',x).then(pull)}}}}
};
// ---------- GAME LIBRARY ----------

D('low','react','react','⚡ Ghost Reaction','Fastest finger wins.','Tap Start, wait for the ghost to appear, then tap as fast as you can. Tapping early is a false start. Fastest gets the most points.');
D('direct','desc','desc','🎭 Describe the Spook','Describe your secret word without saying it!','The actor sees a secret word on their phone and describes it to their team without saying it. The team guesses. The host marks if they got it: +5 points.');
const KID_G=['match','whack','sort','hunt','mem','color','monster'],ADU_G=['realfake','bluff','year','jokes','likely','pop'],FIN=['react','mem','desc'];
const TWO=['color','monster','bluff'];
const GL={kid:'Kids',adult:'Adults'},GI={kid:'🧟',adult:'🧛'},GAMES={kid:KID_G,adult:ADU_G};
const BANK={
realfake:[
{q:'Jack-o’-lanterns were first carved from turnips, not pumpkins.',o:['REAL ✅','FAKE 🤥'],a:0,n:'Real! The Irish carved turnips first.'},
{q:'In Victorian England, owning a black cat on Halloween night was illegal.',o:['REAL ✅','FAKE 🤥'],a:1,n:'Fake. Poor cats.'},
{q:'Candy corn was once marketed as “chicken feed.”',o:['REAL ✅','FAKE 🤥'],a:0,n:'Real! Early boxes really used that name.'},

{q:'Who created the monster in Mary Shelley’s “Frankenstein”?',o:['The monster himself','Victor Frankenstein','Igor','Dr. Phil'],a:1},
{q:'Jack Skellington is the Pumpkin King of which town?',o:['Spookyville','Boo Burgh','Halloween Town','Creepsville, Ohio'],a:2},
{q:'Dracula is famous for turning into which animal?',o:['A bat','A goldfish','A very large hamster','A squirrel'],a:0},
{q:'What snack bribes Scooby-Doo into solving mysteries?',o:['Pizza rolls','Raw carrots','Gluten-free kale','Scooby Snacks'],a:3},
{q:'In “Ghostbusters,” the giant villain is the Stay Puft what?',o:['Gingerbread Guy','Marshmallow Man','Cotton Candy Cow','Butter Biscuit'],a:1},
{q:'In “Hocus Pocus,” what are the Sanderson sisters?',o:['Accountants','Mermaids','Witches','Substitute teachers'],a:2}],
jokes:[
{q:'Why did the skeleton go to the party alone?',o:['He had no body to go with','He forgot his invitation','He was bone-tired','He got ghosted'],a:0},
{q:'What do you call a witch who lives at the beach?',o:['A sea-hag','Wavy Gravy','A sand-witch','Moana'],a:2},
{q:'Why did the vampire read the Wall Street Journal?',o:['He loved stocks (and steaks)','It was free at the coffin shop','Bats can’t read','He heard it had great circulation'],a:3},
{q:'What type of music do mummies listen to?',o:['Heavy metal','Wrap music','Tomb-bone country','Smooth jazz'],a:1},
{q:'Why is the graveyard so noisy?',o:['The zombies play loud music','Skeletons tap dance','Because of all the coffin','It’s near an airport'],a:2},
{q:'How do you fix a broken jack-o’-lantern?',o:['Duct tape','Call a gourd-ian','Tell it a joke','With a pumpkin patch'],a:3},
{q:'What kind of streets do zombies like?',o:['Dead ends','Brain Boulevard','Zombie Lane','One-way streets'],a:0},
{q:'What do you get when you cross a vampire and a snowman?',o:['Chilly Dracula','Frostbite','A cold-blooded snow day','Ice Count-ula'],a:1},
{q:'What do ghosts eat for dinner?',o:['Boo-ritos','Ghost peppers','Spook-etti','Casper-roni'],a:2}]};
const YEARS=[['the novel “Frankenstein” was first published',1818],['the novel “Dracula” was published',1897],['the original movie “Halloween” came out',1978],['the movie “Beetlejuice” came out',1988],['the original “Ghostbusters” came out',1984],['“Hocus Pocus” came out',1993],['“Scooby-Doo, Where Are You!” first aired',1969],['the song “Monster Mash” was released',1962],['the movie “Casper” came out',1995]];
const BLUFF=[{q:'Early candy corn was sold with a barnyard nickname. What was it?',real:'Chicken Feed'},{q:'The fear of Halloween has an official name. What is it?',real:'Samhainophobia'},{q:'In Ireland, the first jack-o’-lanterns were carved from which vegetable?',real:'Turnips'}];
const LIKELY=['hide in the bathroom to avoid trick-or-treaters','eat all the candy before the kids see it','scream first in a haunted house','wear the same costume five years in a row','fall asleep before 9pm on Halloween','turn into a zombie before their morning coffee','cry during a Halloween movie','dress up the family pet','start a dance-off at the party'];
const PAL=['#ff8a1f','#7CFC5A','#8a5cff','#ff4d6d','#ffe14d','#4dc3ff','#222222','#ffffff'];
const HATS=['🎩','👑','🧢','🎃','🪄','🎀'],EYES=['👀','👁️','👁️👁️👁️','🕶️','🥽','😳'],MOUTH=['👄','🦷','👅','😬','🫦','🦈'],BODY=['#2fa84f','#e07a10','#7a4de0','#e0405d','#2e9ad6','#d8bd2e'];
const TREAT=['🍫','🍬','🍭','🍪','🍩','🧁'],TRICK=['🕷️','🪱','🦴','💀','🧦','🐍'];
const TWISTS=["🤐 No talking — act it out","🙈 Eyes closed","🐸 Hop on one foot","🤫 Whisper only","🙌 Hands behind your back","🧟 Zombie voice only","🔄 Opposite hand only","🎵 Hum or sing your clues"];
const WORDS=["🧟 Zombie","🧙 Witch on a broom","🎃 Carving a pumpkin","🦇 Bat","👻 Ghost","🕷️ Spider","🧛 Vampire","🍬 Trick-or-treating","🪦 Rising from a grave","🐺 Werewolf","🧹 Sweeping with a broom","🕸️ Spider web"];
const SYM=['🎃','🦇','👻','🕷️'];
// ---------- STATE ----------
let db=null,S=null,P=[],R={},RD={},AC={},tq={},lk={},G={},ovT=[],SC={g:{},f:{}},me=localStorage.getItem('hh_me')||null,step=null,picks={},pad={},sim={},wd={},pws={},hostUntil=0,dirty=false,err='',sent=new Set();
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const by=id=>P.find(p=>p.id===id);
const members=g=>P.filter(p=>p.group===g);
const num=v=>typeof v==='number'?v:0;
const fg=()=>[...FIN,...Array(num(S&&S.sd)).fill('react')];
const typing=a=>a&&a.closest&&a.closest('#app')&&(/TEXTAREA|SELECT/.test(a.tagName)||(a.tagName==='INPUT'&&a.type!=='checkbox'));
const ok=()=>Date.now()<hostUntil;
const mine=()=>me&&by(me)?[by(me),...P.filter(p=>p.helper===me)]:[];
const cnt=()=>({k:members('kid').length,a:members('adult').length});
const canGo=()=>{const c=cnt();return c.k>=2&&c.a>=2};
const upd=o=>DB.doc('game/state').update(o);
const tstat=t=>{const tk=S['tk'+t]||{st:'idle'};return tk.st==='live'&&RD[`${t}_${tk.gi}_${tk.rd}`]==='done'?'scored':tk.st};
const fstat=()=>S.fst==='live'&&RD[`f_${S.fi}_1`]==='done'?'scored':S.fst;
// ---------- SCORING (derived, so it can never double-count) ----------
function rankOut(arr,out){let last=null,ri=0;arr.forEach((x,i)=>{if(x.v!==last){ri=i;last=x.v}out[x.id]=T[ri]||1})}
function roundPts(key,gid,mem){
  const out={};if(RD[key]!=='done'||!GM[gid])return out;
  const g=GM[gid],ent=R[key]||{},vt=R[key+'v']||{};
  if(g.type==='low')rankOut(mem.filter(p=>ent[p.id]&&ent[p.id].v<9000).map(p=>({id:p.id,v:ent[p.id].v})).sort((a,b)=>a.v-b.v),out);
  else if(g.type==='high')rankOut(mem.filter(p=>ent[p.id]&&ent[p.id].v>0).map(p=>({id:p.id,v:ent[p.id].v})).sort((a,b)=>b.v-a.v),out);
  else if(g.type==='vote'){const c={};Object.values(vt).forEach(x=>c[x.v]=(c[x.v]||0)+1);rankOut(mem.filter(p=>ent[p.id]).map(p=>({id:p.id,v:c[p.id]||0})).sort((a,b)=>b.v-a.v),out)}
  else if(g.type==='bluff')Object.values(vt).forEach(x=>{if(x.v==='REAL')out[x.pid]=(out[x.pid]||0)+8;else out[x.v]=(out[x.v]||0)+5});
  else if(g.type==='likely'){const tal=[{},{},{}];Object.values(ent).forEach(x=>String(x.t||'').split(',').forEach((id,i)=>{if(id&&tal[i])tal[i][id]=(tal[i][id]||0)+1}));
    tal.forEach(t=>{const m=Math.max(0,...Object.values(t));if(m>0)Object.keys(t).forEach(id=>{if(t[id]===m)out[id]=(out[id]||0)+6})})}
  else mem.forEach(p=>{if(ent[p.id])out[p.id]=ent[p.id].v});
  return out;
}
function computeScores(){
  SC={g:{},f:{}};P.forEach(p=>{SC.g[p.id]=0;SC.f[p.id]=0});if(!S)return;
  ['kid','adult'].forEach(g=>{const sel=S['sel_'+g]||[],t=g==='kid'?'k':'a',mem=members(g);
    for(let gi=0;gi<sel.length;gi++)for(let rd=1;rd<=3;rd++){const o=roundPts(`${t}_${gi}_${rd}`,sel[gi],mem);for(const id in o)SC.g[id]+=o[id]}});
  fg().forEach((gid,fi)=>{const o=roundPts(`f_${fi}_1`,gid,P);for(const id in o)SC.f[id]+=o[id]});
}
const gpts=p=>Math.max(0,(SC.g[p.id]||0)+num(p.adj));
const fpts=p=>SC.f[p.id]||0;
function carry(p){const m=Math.max(0,...members(p.group).map(gpts));return m>0?Math.round(10*gpts(p)/m):0}
const total=p=>carry(p)+fpts(p);
const teamAvg=g=>{const m=members(g);return m.length?m.reduce((s,p)=>s+total(p),0)/m.length:0};
function calcPower(){const hold=[],tie=[];
  ['kid','adult'].forEach(g=>{const r=members(g).sort((a,b)=>gpts(b)-gpts(a)||num(b.coin)-num(a.coin));
    const cut=r[2]&&r[1]&&gpts(r[1])===gpts(r[2]);
    r.slice(0,2).forEach(p=>{if(gpts(p)>0){hold.push(p.id);if(cut&&gpts(p)===gpts(r[1]))tie.push(p.id)}})});
  return{hold,tie}}
// ---------- AUTO ROUND COMPLETION ----------
function activeRounds(){const o=[];if(!S)return o;
  if(S.phase==='live')['k','a'].forEach(t=>{const tk=S['tk'+t];if(tk&&tk.st==='live'){const g=t==='k'?'kid':'adult';o.push({key:`${t}_${tk.gi}_${tk.rd}`,gid:(S['sel_'+g]||[])[tk.gi],mem:members(g)})}});
  if(S.phase==='final'&&S.fst==='live')o.push({key:`f_${S.fi}_1`,gid:fg()[S.fi],mem:P});
  return o}
function setRd(k,st){const id=k+'|'+st;if(sent.has(id))return;sent.add(id);DB.doc('rds/'+k).set({st}).catch(()=>sent.delete(id))}
function autoDone(){activeRounds().forEach(r=>{const g=GM[r.gid];if(!g||g.mode==='desc')return;
  const all=r.mem.length&&r.mem.every(p=>(R[r.key]||{})[p.id]);
  if(TWO.includes(g.mode)){
    if(RD[r.key]==='live'&&all)setRd(r.key,'vote');
    if(RD[r.key]==='vote'&&r.mem.every(p=>(R[r.key+'v']||{})[p.id]))setRd(r.key,'done');
  }else if(RD[r.key]==='live'&&all)setRd(r.key,'done')})}
function refresh(){if(!db)return;autoDone();render()}
async function init(){
  try{await pull()}catch(e){$('#app').innerHTML='<div class="card"><h2>👻 Can’t reach the database</h2><p class="mut">Check the Firebase URL in the file and that the database rules allow read and write. ('+E(e.message)+')</p></div>';return}
  db=DB;
  db.doc('game/state').onSnapshot(s=>{S=s.exists?s.data():null;refresh()});
  db.collection('players').onSnapshot(q=>{P=q.docs.map(d=>({id:d.id,...d.data()}));refresh()});
  db.collection('res').onSnapshot(q=>{R={};q.docs.forEach(d=>{const x=d.data();(R[x.key]=R[x.key]||{})[x.pid]=x});refresh()});
  db.collection('acc').onSnapshot(q=>{AC={};q.docs.forEach(d=>{const x=d.data();(AC[x.gk]=AC[x.gk]||{})[x.pid]=1});refresh()});

const monsterHtml=d=>{const [c,e,m,h]=d.split(',').map(Number);return `<div style="background:${BODY[c]};border-radius:18px;padding:12px;text-align:center;font-size:2.4rem;line-height:1.25">${HATS[h]}<br>${EYES[e]}<br>${MOUTH[m]}</div>`};
function monsterStart(){G.m=[0,0,0,0];openOv(ovHead('👹 Build your monster','')+`<div id="mp"></div><button class="big" onclick="ovFinish(1,G.m.join(','))">Done ✅</button>`);monsterPanel()}
function monsterPanel(){const row=(r,l,a)=>`<div class="mut" style="margin-top:8px">${l}</div><div class="gap">${a.map((x,i)=>`<button class="${G.m[r]===i?'':'alt'}" style="${r===0?`background:${x};min-width:44px;color:#fff`:'font-size:1.6rem'}" onclick="mSet(${r},${i})">${r===0?(G.m[r]===i?'✓':'&nbsp;'):x}</button>`).join('')}</div>`;
  $('#mp').innerHTML=monsterHtml(G.m.join(','))+row(0,'Body',BODY)+row(1,'Eyes',EYES)+row(2,'Mouth',MOUTH)+row(3,'Hat',HATS)}
function mSet(r,i){G.m[r]=i;monsterPanel()}
function bluffStart(){G.q=BLUFF[rdOf(G.key)-1];G.txt='';openOv(ovHead('🎭 Fake It Till You Make It','')+`<div class="gc"><b>${E(G.q.q)}</b></div><p class="mut">Write a believable FAKE answer (keep it short). Everyone votes on which answer is real.</p><input id="bt" maxlength="40" placeholder="Your fake answer" oninput="G.txt=this.value"><button class="big" onclick="bluffDone()">Submit fake answer ✅</button>`)}
function bluffDone(){const t=(G.txt||'').trim();if(!t){alert('Type a fake answer first');return}if(t.toLowerCase()===G.q.real.toLowerCase()){alert('That’s the real answer! Make up a fake one 😉');return}ovFinish(1,t)}
function yearStart(){G.i=0;G.err=0;G.base=(rdOf(G.key)-1)*3;yearShow()}
function yearShow(){const y=YEARS[G.base+G.i];openOv(ovHead('📅 Name That Year','Question '+(G.i+1)+' of 3')+`<div class="gc"><b>In what year ${E(y[0])}?</b></div><input id="yg" inputmode="numeric" maxlength="4" placeholder="e.g. 1985"><button class="big" onclick="yearGo()">Lock it in 🔒</button>`)}
function yearGo(){const v=parseInt($('#yg').value,10);if(!(v>0)){alert('Type a year');return}const y=YEARS[G.base+G.i],d=Math.abs(v-y[1]);G.err+=d;
  openOv(ovHead('📅 Name That Year','')+`<div class="gc">You guessed <b>${v}</b>.<br>Actual: <b>${y[1]}</b> — off by <b>${d}</b> years.</div><button class="big" onclick="yearNext()">${G.i<2?'Next ▶':'Finish ✅'}</button>`)}
function yearNext(){if(G.i<2){G.i++;yearShow()}else ovFinish(G.err,'Total miss: '+G.err+' years')}
init();
</script></body></html>
